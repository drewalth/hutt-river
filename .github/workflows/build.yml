name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        name: Install dependencies
      - run: npm run lint
        name: Lint
      - run: npm run pretty:check
        name: Check code formatting
      - run: npm run build
        name: Typecheck and build
